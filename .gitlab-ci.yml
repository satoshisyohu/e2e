stages:
  - lint
  - e2e

default:
  image: golang:1.26

variables:
  E2E_ENV: stg
  E2E_RUN_ID: $CI_PIPELINE_ID

lint:
  stage: lint
  script:
    - go vet -tags e2e ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

e2e:
  stage: e2e
  script:
    - go install gotest.tools/gotestsum@v1.12.0
    - gotestsum --junitfile report.xml --format testname -- -tags e2e -count=1 ./tests/...
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    # 各サービスのリポジトリから trigger で起動された場合
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    # 定期実行
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # 手動実行
    - if: $CI_PIPELINE_SOURCE == "web"
    # この E2E リポジトリ自体の変更
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
