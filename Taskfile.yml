version: '3'

vars:
  E2E_ENV: '{{.E2E_ENV | default "local"}}'
  GO_TEST_FLAGS: -tags e2e -count=1

env:
  E2E_ENV: '{{.E2E_ENV}}'

tasks:
  test:
    desc: 全 E2E テストを実行する(例 task test E2E_ENV=stg)
    cmds:
      - go test {{.GO_TEST_FLAGS}} ./tests/... {{.CLI_ARGS}}

  test:endpoint:
    desc: endpoint テストのみ実行する
    cmds:
      - go test {{.GO_TEST_FLAGS}} ./tests/endpoint/... {{.CLI_ARGS}}

  test:journey:
    desc: journey テストのみ実行する
    cmds:
      - go test {{.GO_TEST_FLAGS}} ./tests/journey/... {{.CLI_ARGS}}

  test:ci:
    desc: CI 用。JUnit 形式のレポートを report.xml に出力する
    cmds:
      - go run gotest.tools/gotestsum@v1.12.0 --junitfile report.xml --format testname -- {{.GO_TEST_FLAGS}} ./tests/...

  lint:
    desc: build tag 付きでコンパイルと静的解析を行う
    cmds:
      - go vet -tags e2e ./...
